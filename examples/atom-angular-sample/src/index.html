<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atom + Angular example</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  >
  <script>
    // The theme keys off a `dark` class on <html>, the way effect.website does
    // it. Nothing here persists a choice, so the class just tracks the OS.
    const query = matchMedia("(prefers-color-scheme: dark)")
    const applyTheme = () => document.documentElement.classList.toggle("dark", query.matches)
    applyTheme()
    query.addEventListener("change", applyTheme)
  </script>
</head>
<body class="min-h-screen bg-background font-sans text-foreground antialiased">
  <app-root></app-root>
</body>
</html>
